function originalSide(v, id) {
  if (v.originalExists && v.originalIsImage) {
    return `<span class="tag">Original (picture)</span>
      <img data-role="orig-img" class="orig-img" src="/video?id=${id}&which=original" alt="Original picture" loading="lazy">`;
  }
  if (v.originalExists) {
    return `<span class="tag">Original</span>
      <video data-role="orig" src="/video?id=${id}&which=original" poster="/thumb?id=${id}&which=original"
        preload="none" controls playsinline></video>`;
  }
  const msg = v.original ? 'Original file is missing<br>(moved or deleted)' : 'No original linked yet';
  return `<div class="missing">${msg}<button class="tab" data-act="pick">Set original</button></div>`;
}

function pickerHtml() {
  return `<div class="picker"><input data-role="find" placeholder="Search Downloads, split_out, compilation…">
    <div class="opts">${candidateOpts('')}</div>
    <button class="tab" data-act="unlink">Remove original link</button></div>`;
}

function candidateOpts(q) {
  if (!candidates) return '<div class="opt">Loading…</div>';
  if (candidates.error) return `<div class="opt">Couldn't list files (${esc(candidates.error)}). Close and reopen to retry.</div>`;
  q = q.toLowerCase();
  const all = candidates.filter((c) => !q || c.name.toLowerCase().includes(q));
  const more = all.length > 80 ? `<div class="opt">Showing 80 of ${all.length}: type to narrow it down.</div>` : '';
  return more + all.slice(0, 80).map((c) =>
    `<button class="opt" data-pick="${esc(c.path)}">${esc(c.name)}<small>${esc(c.dir)} · ${mb(c.size)} · ${date(c.modified)}</small></button>`
  ).join('') || '<div class="opt">No matches</div>';
}

async function setOriginal(v, original) {
  const r = await api('/api/label', { id: v.id, original });
  if (r.error) return alert(r.error);
  picking = null;
  await load();
}

// Play original + conversion together and keep them lined up.
function playBoth(cardEl) {
  const o = cardEl.querySelector('video[data-role=orig]');
  const c = cardEl.querySelector('video[data-role=conv]');
  if (!o || !c) return;
  if (!c.paused) { c.pause(); o.pause(); return; }
  o.currentTime = c.currentTime;
  o.muted = true; // hear the conversion; unmute the original yourself to compare audio
  Promise.all([o.play(), c.play()]).catch(() => {});
}

document.addEventListener('click', (e) => {
  const d = e.target.closest('[data-act=editdesc]');
  if (!d) return;
  editingDesc = d.closest('.card').dataset.id;
  render();
  const ta = document.querySelector('textarea[data-role=desc]');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
});
document.addEventListener('focusout', (e) => { if (e.target.dataset?.role === 'desc') saveDesc(e.target); });
document.addEventListener('focusout', (e) => { if (e.target.dataset?.role === 'quote') saveQuote(e.target); });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act=editquote], [data-act=copyquote]');
  if (!b) return;
  const v = videos.find((x) => x.id === b.closest('.card').dataset.id);
  if (b.dataset.act === 'copyquote') {
    const ok = await copyText(v.xQuote);
    b.textContent = ok ? 'Copied ✓' : 'Copy failed';
    setTimeout(() => { b.textContent = 'Copy'; }, 1500);
    return;
  }
  editingQuote = v.id;
  render();
  const ta = document.querySelector('textarea[data-role=quote]');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.role !== 'quote') return;
  const n = [...e.target.value.trim()].length;
  const c = e.target.closest('.xq').querySelector('.count');
  c.textContent = `${n}/280`;
  c.classList.toggle('over', n > 280);
});
document.addEventListener('keydown', (e) => {
  if (e.target.dataset?.role === 'quote') {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveQuote(e.target); }
    if (e.key === 'Escape') { editingQuote = null; render(); }
    e.stopImmediatePropagation();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.dataset?.role === 'desc') {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveDesc(e.target); }
    if (e.key === 'Escape') { editingDesc = null; render(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (!openId && ((e.key === '/' && !typing) || (e.key === 'k' && (e.metaKey || e.ctrlKey)))) {
    e.preventDefault(); $('#q').focus(); $('#q').select();
  } else if (e.key === 'Escape' && e.target.id === 'q') {
    $('#q').value = ''; archiveOpen = false; render(); $('#q').blur();
  }
});

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.act === 'openArchive') { archiveOpen = true; return render(); }
  if (t.dataset.finddel) {
    const c = finds[view].find((x) => x.id === t.dataset.finddel);
    if (t.dataset.armed !== '1') { // two-click confirm; browser popups can be blocked
      t.dataset.armed = '1'; t.textContent = 'Click again to remove';
      setTimeout(() => { t.dataset.armed = ''; t.textContent = 'Delete'; }, 3000);
      return;
    }
    const r = await api('/api/finds/delete', { s: view, id: c.id });
    if (r.error) return alert(r.error);
    finds[view] = finds[view].filter((x) => x.id !== c.id);
    return render();
  }
  if (t.dataset.play) {
    const c = finds[view]?.find((x) => x.id === t.dataset.play);
    t.outerHTML = c && c.file
      ? `<video class="${isWide(c) ? 'wide' : ''}" src="${findUrl(c, 'video')}" controls autoplay playsinline></video>`
      : `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(t.dataset.play)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
    return;
  }
  if (t.dataset.tab) return go({ tab: t.dataset.tab });
  if (t.dataset.view) return go({ view: t.dataset.view });
  const songEl = t.closest('.song');
  if (songEl) {
    const s = songs.find((x) => x.id === songEl.dataset.song);
    if (t.dataset.unuse) return setUsedIn(s, s.usedIn.filter((v) => v !== t.dataset.unuse));
    if (t.dataset.act === 'reveal') api('/api/reveal', { id: s.id }).then((r) => r.error && alert('Couldn\'t show it in Finder: ' + r.error));
    return;
  }
  const cardEl = t.closest('.card');
  if (!cardEl) return;
  const v = videos.find((x) => x.id === cardEl.dataset.id);
  if (t.dataset.act === 'addpost') { addingPost = addingPost === v.id ? null : v.id; return render(); }
  if (t.dataset.act === 'cancelpost') { addingPost = null; return render(); }
  if (t.dataset.act === 'rmpost') {
    const key = `${v.id}|${t.dataset.i}`;
    if (armedPost !== key) { // two-click confirm, like Delete
      armedPost = key; render();
      setTimeout(() => { if (armedPost === key) { armedPost = null; render(); } }, 3000);
      return;
    }
    armedPost = null;
    const p = v.posts[+t.dataset.i];
    const r = await api('/api/post', { id: v.id, account: p.account, url: p.url || '', remove: true });
    if (r.error) return alert(r.error);
    v.posts = r.posts;
    return render();
  }
  if (t.dataset.pick) return setOriginal(v, t.dataset.pick);
  if (t.dataset.act === 'unlink') return setOriginal(v, null);
  if (t.dataset.act === 'both') return playBoth(cardEl);
  if (t.dataset.act === 'pick') {
    picking = picking === v.id ? null : v.id;
    render();
    if (picking) {
      // Fresh every time: clips downloaded since the page opened show up.
      candidates = null; render();
      candidates = await fetch('/api/candidates').then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
        .catch((err) => ({ error: String(err.message || err) }));
      render();
    }
    document.querySelector(`.card[data-id="${CSS.escape(v.id)}"] [data-role=find]`)?.focus();
    return;
  }
  if (t.dataset.act === 'archive') return saveFlag(v, 'archived', !v.archived);
  if (t.dataset.act === 'approved') return saveFlag(v, 'approved', !v.approved, { approvedAt: !v.approved ? new Date().toISOString() : null });
  if (t.dataset.act === 'posted') return saveFlag(v, 'posted', !v.posted);
  if (t.dataset.status === 'delete' || t.dataset.act === 'trash') {
    // Delete = move the file to the macOS Trash ("Put Back" restores it). Two clicks instead of a
    // confirm() popup, because the in-app browser can block popups.
    // The armed state lives outside the button: a reload (e.g. on window focus) re-renders the cards.
    if (armedDelete !== v.id) {
      armedDelete = v.id;
      render();
      clearTimeout(armedTimer);
      armedTimer = setTimeout(() => { armedDelete = null; render(); }, 3000);
      return;
    }
    clearTimeout(armedTimer);
    armedDelete = null;
    t.disabled = true;
    t.textContent = 'Moving to Trash…';
    const r = await api('/api/trash', { id: v.id });
    if (r.error) { t.disabled = false; t.textContent = 'Couldn\'t delete: ' + r.error; return; }
    const at = order.indexOf(v.id), nextId = order[at + 1] || order[at - 1] || null;
    videos = videos.filter((x) => x.id !== v.id);
    order = order.filter((id) => id !== v.id);
    if (nextId && videos.some((x) => x.id === nextId)) openReview(nextId); else closeReview();
    render();
  } else if (t.dataset.status) {
    // Clicking the active label again clears it.
    return saveFlag(v, 'status', v.status === t.dataset.status ? 'ok' : t.dataset.status);
  } else if (t.dataset.act === 'reveal') {
    api('/api/reveal', { id: v.id }).then((r) => r.error && alert('Couldn\'t show it in Finder: ' + r.error));
  }
});

// "Used in" chip: jump to that video.
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-goto]');
  if (!a) return;
  e.preventDefault();
  const v = videos.find((x) => x.id === a.dataset.goto);
  go({ view: 'videos', tab: 'all', folder: 'all' }, { render: false });
  $('#q').value = v ? v.name : '';
  openId = v ? v.id : null;
  render();
});

document.addEventListener('change', (e) => {
  const songEl = e.target.closest('.song');
  if (songEl) {
    const s = songs.find((x) => x.id === songEl.dataset.song);
    if (e.target.dataset.role === 'use' && e.target.value) return setUsedIn(s, [...s.usedIn, e.target.value]);
    if (e.target.matches('textarea')) {
      const old = s.note, ta = e.target;
      s.note = ta.value;
      api('/api/label', { id: s.id, note: s.note }).then((r) => { if (r.error) { s.note = old; ta.value = old; alert('Note not saved: ' + r.error); } });
    }
    return;
  }
  if (e.target.id === 'folder' || e.target.id === 'showArchive' || e.target.id === 'where') render();
});
let searchTimer;
$('#q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  archiveOpen = false;
  searchTimer = setTimeout(render, 120);
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.role === 'find') e.target.nextElementSibling.innerHTML = candidateOpts(e.target.value);
});
// Keep the original in step when you seek or pause the conversion during "Play both".
document.addEventListener('seeked', (e) => {
  if (e.target.dataset.role !== 'conv') return;
  const o = e.target.closest('.card').querySelector('video[data-role=orig]');
  if (o && !o.paused) o.currentTime = e.target.currentTime;
}, true);
document.addEventListener('pause', (e) => {
  if (e.target.dataset.role !== 'conv') return;
  e.target.closest('.card').querySelector('video[data-role=orig]')?.pause();
}, true);
// Enter / Space on the clickable description and "+ Add source link" act like a click.
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role=button][data-act]')) { e.preventDefault(); t.click(); }
});
// Pick up new files when you come back to the tab.
window.addEventListener('focus', () => { if (!picking && !editingDesc && !editingQuote && !editingSrc && !addingPost) load(); });
// ───────────── Pages ─────────────
// Every sidebar item is its own page with its own address, so Back / Forward / reload keep your place:
//   #/videos/<tab>[/<folder>]   e.g. #/videos/approved/other
//   #/songs   #/finds/<section>
function routeHash(v = view, t = tab, f = $('#folder').value) {
  if (v === 'songs') return '#/songs';
  if (v in FINDS) return '#/finds/' + v;
  return '#/videos/' + t + (f && f !== 'all' ? '/' + f : '');
}
function applyRoute() {
  const [, kind, a, b] = (location.hash.match(/^#\/([a-z]+)(?:\/([a-z0-9-]+))?(?:\/([a-z0-9-]+))?$/) || []);
  const prevView = view;
  if (kind === 'songs') view = 'songs';
  else if (kind === 'finds' && Object.hasOwn(FINDS, a)) view = a;
  else {
    view = 'videos';
    tab = TABS.some((x) => x[0] === a) ? a : 'all';
    $('#folder').value = [...$('#folder').options].some((o) => o.value === b) ? b : 'all';
  }
  if (view !== prevView) $('#q').value = '';
  pageTitle();
}
function pageTitle() {
  const name = view === 'songs' ? 'Songs' : view in FINDS ? FINDS[view].label.replace(/^\S+ /, '') + ' finds'
    : [TABS.find((x) => x[0] === tab)[1], $('#folder').value === 'all' ? '' : FOLDER_NAME[$('#folder').value]].filter(Boolean).join(' · ');
  document.title = `${view === 'videos' ? 'Videos · ' : ''}${name} — Video Studio Library`;
}
// Go to another page (a new history entry). A video open in the review panel closes.
// The address changes at once (pushState), so callers can set more state before rendering.
function go(change, { render: doRender = true } = {}) {
  const next = routeHash(change.view ?? (change.tab || change.folder ? 'videos' : view), change.tab ?? tab, change.folder ?? $('#folder').value);
  if (openId) closeReview();
  if (location.hash !== next) history.pushState(null, '', next);
  applyRoute();
  if (doRender) render();
}
// Back / Forward (and a typed address) land here.
window.addEventListener('hashchange', () => { if (openId) closeReview(); applyRoute(); render(); });
fetch('/api/config').then((r) => r.json()).catch(() => ({})).then((c) => {
  setConfig(c);
  if (!location.hash) history.replaceState(null, '', routeHash());
  applyRoute();
  load();
});
</script>
